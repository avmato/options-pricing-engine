name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # A regular (non-editable) install: setuptools' editable hook writes a
          # .pth file with a leading double underscore, which CPython 3.13 skips.
          pip install ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

      - name: Reproduce the published results
        run: |
          python -m optlab.cli audit data/snapshots/SPY_2026-07-25_multi_expiry.csv \
            --output /tmp/reports --no-figures --quiet
          python - <<'PY'
          import pandas as pd
          funnel = pd.read_csv("/tmp/reports/violation_funnel.csv")
          survivors = int(funnel.iloc[-1]["violations"])
          assert survivors == 0, f"headline result changed: {survivors} violations survive"
          print("headline reproduced: 0 violations survive every filter")
          PY
