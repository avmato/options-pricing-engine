# One snapshot is one day's opinion. This job turns the study into a panel by
# capturing the SPY option chain after every US close and committing it, so
# the audit can eventually be run across many trading days rather than one.
name: daily-snapshot

on:
  schedule:
    - cron: "20 20 * * 1-5" # 20:20 UTC, shortly after the 20:00 UTC US close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[data]"

      - name: Capture the chain
        run: python -m optlab.cli fetch --ticker SPY --output data/snapshots

      - name: Commit if anything was captured
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "data: SPY option-chain snapshot $(date -u +%Y-%m-%d)"
          git push
